spring.application.name=cartcraft-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cartcraft}
spring.datasource.username=${DB_USERNAME:cartcraft}
spring.datasource.password=${DB_PASSWORD:cartcraft-local}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
