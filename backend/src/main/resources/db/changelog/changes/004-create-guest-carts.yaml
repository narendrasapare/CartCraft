databaseChangeLog:
  - changeSet:
      id: 004-create-guest-carts
      author: cartcraft
      changes:
        - createTable:
            tableName: guest_carts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_cart
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: guest_carts
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_product
            baseTableName: cart_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_cart_items_cart_product
            tableName: cart_items
            columnNames: cart_id, product_id
        - sql:
            sql: ALTER TABLE cart_items ADD CONSTRAINT chk_cart_items_quantity CHECK (quantity BETWEEN 1 AND 99);
        - createIndex:
            indexName: idx_cart_items_cart_id
            tableName: cart_items
            columns:
              - column:
                  name: cart_id
      rollback:
        - dropTable:
            tableName: cart_items
        - dropTable:
            tableName: guest_carts
