databaseChangeLog:
  - changeSet:
      id: 005-create-customer-identity
      author: cartcraft
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(30)
                  defaultValue: CUSTOMER
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_customers_email
            tableName: customers
            columns:
              - column:
                  name: email
        - createTable:
            tableName: SPRING_SESSION
            columns:
              - column:
                  name: PRIMARY_ID
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: SPRING_SESSION_PK
                    nullable: false
              - column:
                  name: SESSION_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: CREATION_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: LAST_ACCESS_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: MAX_INACTIVE_INTERVAL
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: EXPIRY_TIME
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: PRINCIPAL_NAME
                  type: VARCHAR(320)
        - createIndex:
            indexName: SPRING_SESSION_IX1
            tableName: SPRING_SESSION
            unique: true
            columns:
              - column:
                  name: SESSION_ID
        - createIndex:
            indexName: SPRING_SESSION_IX2
            tableName: SPRING_SESSION
            columns:
              - column:
                  name: EXPIRY_TIME
        - createIndex:
            indexName: SPRING_SESSION_IX3
            tableName: SPRING_SESSION
            columns:
              - column:
                  name: PRINCIPAL_NAME
        - createTable:
            tableName: SPRING_SESSION_ATTRIBUTES
            columns:
              - column:
                  name: SESSION_PRIMARY_ID
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: ATTRIBUTE_NAME
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: ATTRIBUTE_BYTES
                  type: BYTEA
                  constraints:
                    nullable: false
        - addPrimaryKey:
            constraintName: SPRING_SESSION_ATTRIBUTES_PK
            tableName: SPRING_SESSION_ATTRIBUTES
            columnNames: SESSION_PRIMARY_ID, ATTRIBUTE_NAME
        - addForeignKeyConstraint:
            constraintName: SPRING_SESSION_ATTRIBUTES_FK
            baseTableName: SPRING_SESSION_ATTRIBUTES
            baseColumnNames: SESSION_PRIMARY_ID
            referencedTableName: SPRING_SESSION
            referencedColumnNames: PRIMARY_ID
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: SPRING_SESSION_ATTRIBUTES
        - dropTable:
            tableName: SPRING_SESSION
        - dropTable:
            tableName: customers
